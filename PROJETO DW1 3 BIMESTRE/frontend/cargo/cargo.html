<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Cargo</title>
    <link rel="stylesheet" href="cargo.css">
</head>


<body onload="listar()">
    <header>
        <a href="../menu/menu.html" class="btn-voltar">← Voltar ao menu</a>
        <h1>Gerenciamento de Cargos</h1>
        <p>Gerencie os cargos do sistema.</p>
    </header>

    <main class="container-master">
        <div class="abas" data-ativa="cadastro" role="tablist">
            <button type="button" class="aba ativa" id="abaCadastro" data-aba="cadastro" role="tab" aria-selected="true">Cadastro</button>
            <button type="button" class="aba" id="abaLista" data-aba="lista" role="tab" aria-selected="false">
                Cargos cadastrados <span class="aba-contador" id="contador">0</span>
            </button>
        </div>
        <div class="conteudo-principal" id="painelCadastro">
            <section class="form-esquerda">
                <h2>Dados do Cargo</h2>
                
                <label for="inputId_cargo">ID do Cargo</label>
                <div class="linha-id">
                    <input type="number" name="inputId_cargo" id="inputId_cargo" placeholder="Ex: 1" min="1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_cargo">Nome do Cargo</label>
                <input type="text" name="inputNome_cargo" id="inputNome_cargo" placeholder="Ex: Gerente">

                <div id="divAviso">Informe o ID do cargo e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-cargos" id="painelLista" hidden>
            <h3>Cargos Cadastrados</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nome do Cargo</th></tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        <tr class="linha-vazia"><td colspan="2">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Cargo. Todos os direitos reservados. <br>
            Lara Salonski - m32 2026
        </p>
    </footer>

    <script src="./cargo.js"></script>
</body>

</html>
