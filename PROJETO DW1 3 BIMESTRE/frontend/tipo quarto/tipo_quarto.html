<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Tipo de Quarto</title>
    <link rel="stylesheet" href="tipo_quarto.css">
</head>
<body onload="inicializar()">
    <header>
        <a href="../menu/menu.html" class="btn-voltar">← Voltar ao menu</a>
        <h1>Gerenciamento Tipos de Quartos</h1>
        <p>Gerencie os tipos e a foto de cada um.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Tipo</h2>

                <label for="inputId_tipo_quarto">ID do Tipo</label>
                <div class="linha-id">
                    <input type="text" id="inputId_tipo_quarto" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_tipo_quarto">Nome do Tipo</label>
                <input type="text" id="inputNome_tipo_quarto" placeholder="Ex: Standard, Luxo">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>Foto do Tipo</h2>
                <p class="instrucao-imagem">(Clique na imagem para escolher uma foto)</p>
                <div class="img-container">
                    <img id="imgTipo" src="http://localhost:3001/imagens/tipos/skeleton.svg" alt="Foto do tipo de quarto" />
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <section class="lista-unidades">
            <h3>Tipos Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Quartos. Todos os direitos reservados.</p>
    </footer>

    <script src="./tipo_quarto.js"></script>
</body>
</html>
